<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Quick English - Premium Daily Vocab</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --background: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Progress Bar */
        .progress-container {
            background-color: #E5E7EB;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            background-color: var(--secondary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Flashcard Feature */
        .card-box {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }

        .card-box:active {
            transform: scale(0.98);
        }

        .word-en {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .word-type {
            font-size: 0.9rem;
            font-style: italic;
            color: #9CA3AF;
            margin-bottom: 15px;
        }

        .word-id {
            font-size: 1.3rem;
            color: #374151;
            font-weight: 500;
            display: none;
        }

        .hint {
            font-size: 0.85rem;
            color: #9CA3AF;
            margin-top: 15px;
        }

        /* Quiz Feature */
        .quiz-section {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: none;
        }

        .quiz-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        button {
            background-color: #F3F4F6;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            padding-left: 20px;
        }

        button:hover {
            background-color: #E5E7EB;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }

        .btn-next:hover {
            background-color: #4338CA;
        }

        .success-message {
            text-align: center;
            display: none;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ Quick English</h1>
        <p>5 Kata Penting Sehari-hari untuk Naik Level</p>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="flashcardMode">
        <div class="card-box" onclick="flipCard()">
            <div class="word-en" id="vocabEn">-</div>
            <div class="word-type" id="vocabType">-</div>
            <div class="word-id" id="vocabId">-</div>
            <div class="hint" id="cardHint">Ketuk untuk melihat arti</div>
        </div>
        <button class="btn-next" onclick="nextWord()">Lanjut Kata Berikutnya →</button>
    </div>

    <div id="quizMode" class="quiz-section">
        <div class="quiz-title" id="quizQuestion">Memuat kuis...</div>
        <div class="btn-grid" id="quizOptions"></div>
    </div>

    <div id="successMode" class="success-message">
        <h2>🎉 Sesi Selesai!</h2>
        <p>Hebat! 5 kosakata baru berhasil dikuasai. Mau lanjut tantangan lagi?</p>
        <button class="btn-next" onclick="startNewSession()">Pelajari 5 Kata Baru Lainnya 🔄</button>
    </div>
</div>

<script>
    // DATABASE KOSAKATA HARIAN PENTING (Bisa kamu tambah terus ke bawah sesukamu)
    const databaseKosakata = [
        { en: "Anxious", type: "adjective", id: "Cemas / Gelisah" },
        { en: "Appreciate", type: "verb", id: "Menghargai" },
        { en: "Avoid", type: "verb", id: "Menghindari" },
        { en: "Convenient", type: "adjective", id: "Praktis / Mudah" },
        { en: "Exaggerate", type: "verb", id: "Berlebihan / Lebay" },
        { en: "Frequently", type: "adverb", id: "Seringkali" },
        { en: "Grateful", type: "adjective", id: "Bersyukur / Berterima kasih" },
        { en: "Hesitate", type: "verb", id: "Ragu-ragu" },
        { en: "Influence", type: "verb/noun", id: "Memengaruhi / Pengaruh" },
        { en: "Intentionally", type: "adverb", id: "Sengaja" },
        { en: "Maintain", type: "verb", id: "Memelihara / Menjaga" },
        { en: "Notice", type: "verb", id: "Menyadari / Memperhatikan" },
        { en: "Obvious", type: "adjective", id: "Jelas / Nyata" },
        { en: "Opportunity", type: "noun", id: "Kesempatan / Peluang" },
        { en: "Particular", type: "adjective", id: "Spesifik / Khusus" },
        { en: "Persuade", type: "verb", id: "Membujuk / Meyakinkan" },
        { en: "Rarely", type: "adverb", id: "Jarang" },
        { en: "Recommend", type: "verb", id: "Menyarankan / Merekomendasikan" },
        { en: "Reluctant", type: "adjective", id: "Enggan / Segan" },
        { en: "Spontaneous", type: "adjective", id: "Spontan / Tiba-tiba" },
        { en: "Strugle", type: "verb/noun", id: "Berjuang / Perjuangan" },
        { en: "Sufficient", type: "adjective", id: "Cukup / Memadai" },
        { en: "Tendency", type: "noun", id: "Kecenderungan" },
        { en: "Urgent", type: "adjective", id: "Penting / Mendesak" },
        { en: "Vague", type: "adjective", id: "Samar / Tidak jelas" }
    ];

    let sessionDataset = []; 
    let currentIndex = 0;
    let isFlipped = false;
    let isQuizPhase = false;

    function startNewSession() {
        currentIndex = 0;
        isFlipped = false;
        isQuizPhase = false;

        // 1. Ambil 5 kata secara acak dari database besar di atas
        const shuffled = [...databaseKosakata].sort(() => 0.5 - Math.random());
        const selectedWords = shuffled.slice(0, 5);

        // 2. Buat opsi kuis pilihan ganda secara dinamis (1 benar, 3 acak salah)
        sessionDataset = selectedWords.map(item => {
            const wrongAnswers = shuffled
                .filter(x => x.id !== item.id)
                .slice(0, 3)
                .map(x => x.id);

            return {
                en: item.en,
                type: item.type,
                id: item.id,
                options: shuffleArray([item.id, ...wrongAnswers])
            };
        });

        // 3. Tampilkan UI Flashcard
        document.getElementById("successMode").style.display = "none";
        document.getElementById("quizMode").style.display = "none";
        document.getElementById("flashcardMode").style.display = "block";

        showWord();
        updateProgress();
    }

    function showWord() {
        const currentData = sessionDataset[currentIndex];
        document.getElementById("vocabEn").innerText = currentData.en;
        document.getElementById("vocabType").innerText = `(${currentData.type})`;
        document.getElementById("vocabId").innerText = currentData.id;
        
        document.getElementById("vocabId").style.display = "none";
        document.getElementById("cardHint").innerText = "Ketuk untuk melihat arti";
        isFlipped = false;
    }

    function flipCard() {
        const idText = document.getElementById("vocabId");
        const hint = document.getElementById("cardHint");
        
        if (!isFlipped) {
            idText.style.display = "block";
            hint.innerText = "Ketuk lagi untuk menyembunyikan";
            isFlipped = true;
        } else {
            idText.style.display = "none";
            hint.innerText = "Ketuk untuk melihat arti";
            isFlipped = false;
        }
    }

    function nextWord() {
        if (currentIndex < sessionDataset.length - 1) {
            currentIndex++;
            showWord();
            updateProgress();
        } else {
            isQuizPhase = true;
            currentIndex = 0;
            document.getElementById("flashcardMode").style.display = "none";
            document.getElementById("quizMode").style.display = "block";
            loadQuiz();
        }
    }

    function loadQuiz() {
        updateProgress();
        const currentData = sessionDataset[currentIndex];
        document.getElementById("quizQuestion").innerText = `Apa arti dari kata "${currentData.en}"?`;
        
        const optionsContainer = document.getElementById("quizOptions");
        optionsContainer.innerHTML = ""; 

        currentData.options.forEach(option => {
            const btn = document.createElement("button");
            btn.innerText = option;
            btn.onclick = () => checkAnswer(option, currentData.id, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selected, correct, button) {
        if (selected === correct) {
            button.style.backgroundColor = "#10B981";
            button.style.color = "white";
            button.style.borderColor = "#10B981";
            
            setTimeout(() => {
                if (currentIndex < sessionDataset.length - 1) {
                    currentIndex++;
                    loadQuiz();
                } else {
                    document.getElementById("quizMode").style.display = "none";
                    document.getElementById("successMode").style.display = "block";
                    document.getElementById("progressBar").style.width = "100%";
                }
            }, 800);
        } else {
            button.style.backgroundColor = "#EF4444";
            button.style.color = "white";
            button.style.borderColor = "#EF4444";
        }
    }

    function updateProgress() {
        if (sessionDataset.length === 0) return;
        const totalSteps = sessionDataset.length * 2;
        let currentStep = currentIndex;
        if (isQuizPhase) {
            currentStep = sessionDataset.length + currentIndex;
        }
        const percentage = (currentStep / totalSteps) * 100;
        document.getElementById("progressBar").style.width = percentage + "%";
    }

    function shuffleArray(array) {
        return array.sort(() => 0.5 - Math.random());
    }

    // Jalankan sesi pertama kali saat web dibuka
    startNewSession();
</script>

</body>
</html>
