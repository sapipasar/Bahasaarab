<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator ID - AR - EN</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container UI Mobile */
        .app-container {
            width: 100%;
            max-width: 410px;
            background: #ffffff;
            height: 100vh;
            max-height: 840px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #2575fc, #6a11cb);
            color: white;
            padding: 25px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        /* Dropdown Pemilih Bahasa */
        .language-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        select {
            font-weight: 600;
            color: #334155;
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 15px;
            border: 1px solid #cbd5e1;
            outline: none;
            cursor: pointer;
            width: 42%;
            font-size: 0.9rem;
        }

        .swap-btn {
            background: #6a11cb;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .swap-btn:hover {
            transform: scale(1.1);
        }

        /* Area Konten Utama */
        .translation-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
        }

        .text-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 160px;
        }

        textarea {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            flex: 1;
        }

        /* Mode Text Arab (RTL & Font Lebih Besar Agar Harakat Jelas) */
        .rtl-text {
            direction: rtl;
            text-align: right;
            font-family: 'Amiri', 'Traditional Arabic', Arial, sans-serif;
            font-size: 1.4rem;
            line-height: 2rem;
        }

        .box-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .action-btn:hover {
            color: #2575fc;
        }

        /* Tombol Utama Mikrofon */
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }

        .mic-btn {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #2575fc, #6a11cb);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
            transition: 0.3s;
        }

        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background: #ef4444;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .mic-label {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <i class="fa-solid fa-language"></i> Multi-Lang Translator
        </div>

        <div class="language-selector">
            <select id="srcLang">
                <option value="id" selected>Indonesia</option>
                <option value="ar">Arab (العربية)</option>
                <option value="en">Inggris</option>
            </select>
            
            <button class="swap-btn" id="swapLangBtn" title="Tukar posisi"><i class="fa-solid fa-arrows-rotate"></i></button>
            
            <select id="targetLang">
                <option value="id">Indonesia</option>
                <option value="ar" selected>Arab (العربية)</option>
                <option value="en">Inggris</option>
            </select>
        </div>

        <div class="translation-area">
            <div class="text-box">
                <textarea id="inputText" placeholder="Masukkan teks atau tekan mikrofon..."></textarea>
                <div class="box-actions">
                    <button class="action-btn" id="clearBtn" title="Hapus"><i class="fa-solid fa-xmark"></i></button>
                    <button class="action-btn" id="speakInputBtn" title="Dengarkan"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>

            <div class="text-box" style="background: #f1f5f9;">
                <textarea id="outputText" readonly placeholder="Terjemahan akan muncul di sini..."></textarea>
                <div class="box-actions">
                    <button class="action-btn" id="copyBtn" title="Salin Teks"><i class="fa-solid fa-copy"></i></button>
                    <button class="action-btn" id="speakOutputBtn" title="Dengarkan Terjemahan"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="micBtn">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <span class="mic-label" id="micStatus">Tekan untuk Bicara</span>
        </div>
    </div>

    <script>
        // Elemen HTML
        const srcLang = document.getElementById('srcLang');
        const targetLang = document.getElementById('targetLang');
        const swapLangBtn = document.getElementById('swapLangBtn');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const speakInputBtn = document.getElementById('speakInputBtn');
        const speakOutputBtn = document.getElementById('speakOutputBtn');

        // Peta kode bahasa untuk Suara (Speech)
        const speechLangCodes = {
            'id': 'id-ID',
            'ar': 'ar-SA',
            'en': 'en-US'
        };

        // Fungsi mengatur tata letak teks (RTL untuk Bahasa Arab)
        function checkLayoutDirection() {
            if (srcLang.value === 'ar') {
                inputText.classList.add('rtl-text');
            } else {
                inputText.classList.remove('rtl-text');
            }

            if (targetLang.value === 'ar') {
                outputText.classList.add('rtl-text');
            } else {
                outputText.classList.remove('rtl-text');
            }
        }

        // Fungsi Utama Terjemahan + Otomatisasi Harakat jika targetnya Arab
        async function translateText(text) {
            if (!text.trim()) {
                outputText.value = "";
                return;
            }
            
            const sl = srcLang.value;
            const tl = targetLang.value;
            
            try {
                outputText.value = "Menerjemahkan...";
                
                // Fetch terjemahan dasar
                let res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
                let data = await res.json();
                let translatedResult = data[0].map(item => item[0]).join('');

                // FITUR HARAKAT OTOMATIS: Jika target bahasa adalah ARAB
                if (tl === 'ar') {
                    outputText.value = "Menghasilkan Harakat...";
                    // Memanfaatkan engine harakat otomatis eksternal gratis (Mishkal / Ali-soft)
                    let harakatRes = await fetch(`https://multilanguage-tashkeel.onrender.com/api?text=${encodeURIComponent(translatedResult)}`).catch(() => null);
                    
                    if (harakatRes) {
                        let harakatData = await harakatRes.json();
                        if (harakatData && harakatData.result) {
                            translatedResult = harakatData.result;
                        }
                    } else {
                        // Backup ke API alternatif jika server sibuk
                        let backupHarakat = await fetch(`https://api.alsharekh.org/v1/diacritizer?text=${encodeURIComponent(translatedResult)}`).catch(() => null);
                        if(backupHarakat) {
                             let bData = await backupHarakat.json();
                             if(bData.diacritized_text) translatedResult = bData.diacritized_text;
                        }
                    }
                }

                outputText.value = translatedResult;
            } catch (error) {
                outputText.value = "[Gagal memproses, periksa koneksi internet Anda]";
                console.error(error);
            }
        }

        // Event saat mengetik
        let typingTimer;
        inputText.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                translateText(inputText.value);
            }, 1000);
        });

        // Event ketika pilihan bahasa diubah manual
        srcLang.addEventListener('change', () => { checkLayoutDirection(); translateText(inputText.value); });
        targetLang.addEventListener('change', () => { checkLayoutDirection(); translateText(inputText.value); });

        // Fitur Swap / Tukar Posisi Bahasa
        swapLangBtn.addEventListener('click', () => {
            let tempLang = srcLang.value;
            srcLang.value = targetLang.value;
            targetLang.value = tempLang;

            let tempText = inputText.value;
            inputText.value = outputText.value;
            outputText.value = tempText;

            checkLayoutDirection();
            translateText(inputText.value);
        });

        // FITUR: VOICE TO TEXT (Mik)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.lang = speechLangCodes[srcLang.value];
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                micStatus.innerText = "Mendengarkan... Silakan bicara";
            };

            recognition.onerror = () => {
                micBtn.classList.remove('listening');
                micStatus.innerText = "Gagal mendengar, coba tekan lagi.";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micStatus.innerText = "Tekan untuk Bicara";
            };

            recognition.onresult = (event) => {
                const textResult = event.results[0][0].transcript;
                inputText.value = textResult;
                translateText(textResult);
            };
        } else {
            micBtn.style.background = "#cbd5e1";
            micStatus.innerText = "Fitur Mikrofon tidak didukung browser ini.";
            micBtn.disabled = true;
        }

        // FITUR: TEXT TO SPEECH (Speaker Suara)
        function playAudio(text, lang) {
            if (!text.trim()) return;
            window.speechSynthesis.cancel(); // Hentikan suara sebelumnya jika ada
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = speechLangCodes[lang];
            window.speechSynthesis.speak(utterance);
        }

        speakInputBtn.addEventListener('click', () => playAudio(inputText.value, srcLang.value));
        speakOutputBtn.addEventListener('click', () => playAudio(outputText.value, targetLang.value));

        // Tombol Tambahan
        clearBtn.addEventListener('click', () => { inputText.value = ""; outputText.value = ""; });
        copyBtn.addEventListener('click', () => {
            if (!outputText.value) return;
            navigator.clipboard.writeText(outputText.value);
            alert("Terjemahan berhasil disalin!");
        });

        // Jalankan pengecekan posisi di awal load aplikasi
        checkLayoutDirection();
    </script>
</body>
</html>
