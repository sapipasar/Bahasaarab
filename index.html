<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Translator ID-AR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container mirip UI Handphone */
        .app-container {
            width: 100%;
            max-width: 410px;
            background: #ffffff;
            height: 100vh;
            max-height: 840px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header Aplikasi */
        .header {
            background: linear-gradient(135deg, #2575fc, #6a11cb);
            color: white;
            padding: 25px 20px;
            text-align: center;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Bagian Pemilih Bahasa */
        .language-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .lang-box {
            font-weight: 600;
            color: #334155;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            min-width: 120px;
            text-align: center;
        }

        .swap-btn {
            background: #6a11cb;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .swap-btn:hover {
            transform: scale(1.1);
        }

        /* Area Konten Utama */
        .translation-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
        }

        .text-box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 150px;
        }

        .text-box.active {
            border-color: #2575fc;
        }

        textarea {
            width: 100%;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-size: 1rem;
            color: #1e293b;
            flex: 1;
        }

        /* Kotak output arab disesuaikan arah tulisannya (RTL) jika mode aktif */
        .rtl-text {
            direction: rtl;
            text-align: right;
            font-family: Arial, sans-serif;
            font-size: 1.2rem;
        }

        /* Tombol Aksi di setiap Box (Salin, Suara) */
        .box-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .action-btn:hover {
            color: #2575fc;
        }

        /* Tombol Utama Mikrofon (Mendikte Suara) */
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 0;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }

        .mic-btn {
            width: 75px;
            height: 75px;
            background: radial-gradient(circle, #2575fc, #6a11cb);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(106, 17, 203, 0.4);
            transition: 0.3s;
        }

        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background: #ef4444;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .mic-label {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }

        /* Animasi Berdenyut Saat Rekam Suara */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <i class="fa-solid fa-language"></i> Voice Translator
        </div>

        <div class="language-selector">
            <div class="lang-box" id="srcLangText">Indonesia</div>
            <button class="swap-btn" id="swapLangBtn"><i class="fa-solid fa-arrows-rotate"></i></button>
            <div class="lang-box" id="targetLangText">Arab (العربية)</div>
        </div>

        <div class="translation-area">
            <div class="text-box" id="inputBoxContainer">
                <textarea id="inputText" placeholder="Masukkan teks atau tekan mikrofon..."></textarea>
                <div class="box-actions">
                    <button class="action-btn" id="clearBtn" title="Hapus"><i class="fa-solid fa-xmark"></i></button>
                    <button class="action-btn" id="speakInputBtn" title="Dengarkan"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>

            <div class="text-box" style="background: #f1f5f9;">
                <textarea id="outputText" readonly placeholder="Terjemahan akan muncul di sini..."></textarea>
                <div class="box-actions">
                    <button class="action-btn" id="copyBtn" title="Salin Teks"><i class="fa-solid fa-copy"></i></button>
                    <button class="action-btn" id="speakOutputBtn" title="Dengarkan Terjemahan"><i class="fa-solid fa-volume-high"></i></button>
                </div>
            </div>
        </div>

        <div class="mic-container">
            <button class="mic-btn" id="micBtn">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <span class="mic-label" id="micStatus">Tekan untuk Bicara</span>
        </div>
    </div>

    <script>
        // State Konfigurasi Bahasa
        let isIdToAr = true; // True = ID ke AR, False = AR ke ID
        
        // Elemen UI
        const srcLangText = document.getElementById('srcLangText');
        const targetLangText = document.getElementById('targetLangText');
        const swapLangBtn = document.getElementById('swapLangBtn');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const micBtn = document.getElementById('micBtn');
        const micStatus = document.getElementById('micStatus');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const speakInputBtn = document.getElementById('speakInputBtn');
        const speakOutputBtn = document.getElementById('speakOutputBtn');

        // Mengatur teks arah penulisan (RTL untuk Arab)
        function updateTextDirection() {
            if (isIdToAr) {
                inputText.classList.remove('rtl-text');
                outputText.classList.add('rtl-text');
                inputText.placeholder = "Masukkan teks...";
                outputText.placeholder = "Terjemahan...";
            } else {
                inputText.classList.add('rtl-text');
                outputText.classList.remove('rtl-text');
                inputText.placeholder = "اكتب هنا...";
                outputText.placeholder = "Terjemahan...";
            }
        }

        // Fungsi Tukar Bahasa
        swapLangBtn.addEventListener('click', () => {
            isIdToAr = !isIdToAr;
            if (isIdToAr) {
                srcLangText.innerText = "Indonesia";
                targetLangText.innerText = "Arab (العربية)";
            } else {
                srcLangText.innerText = "Arab (العربية)";
                targetLangText.innerText = "Indonesia";
            }
            // Tukar isi teks
            let temp = inputText.value;
            inputText.value = outputText.value;
            outputText.value = temp;
            updateTextDirection();
        });

        // INTEGRASI API PENERJEMAH (Menggunakan API Publik Gratis)
        async function translateText(text) {
            if (!text.trim()) {
                outputText.value = "";
                return;
            }
            
            const sourceLang = isIdToAr ? 'id' : 'ar';
            const targetLang = isIdToAr ? 'ar' : 'id';
            
            try {
                outputText.value = "Menerjemahkan...";
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                
                // Menggabungkan hasil translasi jika kalimatnya panjang
                let translatedResult = data[0].map(item => item[0]).join('');
                outputText.value = translatedResult;
            } catch (error) {
                outputText.value = "[Gagal mengambil terjemahan, periksa koneksi internet]";
                console.error(error);
            }
        }

        // Memicu penerjemahan saat user selesai mengetik (Debounce otomatis kecil)
        let typingTimer;
        inputText.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                translateText(inputText.value);
            }, 800);
        });

        // FEATURE 1: SPEECH TO TEXT (Pengenal Suara / Mik)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                // Set bahasa pengenal suara tergantung bahasa asal
                recognition.lang = isIdToAr ? 'id-ID' : 'ar-SA';
                
                if (micBtn.classList.contains('listening')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                micStatus.innerText = "Mendengarkan... Bicaralah sekarang";
            };

            recognition.onerror = (e) => {
                console.error(e);
                micBtn.classList.remove('listening');
                micStatus.innerText = "Gagal mendengarkan. Coba lagi.";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micStatus.innerText = "Tekan untuk Bicara";
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                inputText.value = speechToText;
                translateText(speechToText); // Langsung terjemahkan suara yang didengar
            };
        } else {
            micBtn.style.background = "#cbd5e1";
            micStatus.innerText = "Fitur suara tidak didukung browser ini.";
            micBtn.disabled = true;
        }

        // FEATURE 2: TEXT TO SPEECH (Mengeluarkan Suara lewat Speaker)
        function speak(text, langCode) {
            if (!text.trim()) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            window.speechSynthesis.speak(utterance);
        }

        speakInputBtn.addEventListener('click', () => {
            const lang = isIdToAr ? 'id-ID' : 'ar-SA';
            speak(inputText.value, lang);
        });

        speakOutputBtn.addEventListener('click', () => {
            const lang = isIdToAr ? 'ar-SA' : 'id-ID';
            speak(outputText.value, lang);
        });

        // Fitur Tambahan (Clear & Copy)
        clearBtn.addEventListener('click', () => {
            inputText.value = "";
            outputText.value = "";
        });

        copyBtn.addEventListener('click', () => {
            if (!outputText.value) return;
            navigator.clipboard.writeText(outputText.value);
            alert("Teks terjemahan berhasil disalin!");
        });

        // Inisialisasi awal arah teks
        updateTextDirection();
    </script>
</body>
</html>
